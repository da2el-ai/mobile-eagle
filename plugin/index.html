<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Mobile Eagle — サーバー</title>
  <style>
    /*
     * ステータスウィンドウ（backend/status-window.md）。
     * デザインはモック（.claude/design/Eagle Server.dc.html）に準拠するが、
     * 外部リソースは使わない（フォントはシステム、アイコンはインライン SVG、
     * QR はローカル qrcode）。テーマはダーク固定。
     */
    :root {
      --bg: #232729;
      --fg: #ffffff;
      --elev: #33383b;
      --border: rgba(255, 255, 255, .13);
      --muted: #9aa1a5;
      --hover: rgba(255, 255, 255, .07);
      --accent: #2f6fed;
      --ok: #22a06b;
      --err: #e2554b;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      /* display: flex; */
      flex-direction: column;
      background: var(--bg);
      color: var(--fg);
      font-family: "Helvetica Neue", Helvetica, Arial, "Hiragino Sans", "Noto Sans JP", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-size: 14px;
    }

    /* 等幅（URL・ポート・IP・ログ）。外部フォントは使わずシステム等幅 */
    .mono {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }

    input, select, button {
      font-family: inherit;
    }

    svg {
      display: block;
      fill: currentColor;
    }

    ::-webkit-scrollbar {
      width: 9px;
      height: 9px;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, .25);
      border-radius: 5px;
    }

    .body {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }

    .top {
      flex: none;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 22px;
    }

    .divider {
      height: 1px;
      background: var(--border);
    }

    /* サーバートグル */
    .toggle-wrap {
      display: flex;
      flex-direction: column;
      gap: 12px;
      align-items: center;
      text-align: center;
    }

    .switch {
      position: relative;
      width: 74px;
      height: 38px;
      border: none;
      border-radius: 19px;
      padding: 0;
      cursor: pointer;
      background: #c4c7cb;
      transition: background .2s;
      touch-action: manipulation;
    }

    .switch.on {
      background: var(--ok);
    }

    .switch-knob {
      position: absolute;
      top: 3px;
      left: 3px;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 2px 5px rgba(0, 0, 0, .3);
      transition: left .2s;
    }

    .switch.on .switch-knob {
      left: 39px;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .status-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      flex: none;
      background: var(--muted);
    }

    /* トグル下の注意書き（ウィンドウを閉じてもサーバーは止まらない旨） */
    .toggle-note {
      margin: 0;
      font-size: 11px;
      line-height: 1.6;
      color: var(--muted);
    }

    /* アクセス情報 */
    .access {
      display: flex;
      gap: 18px;
      align-items: center;
    }

    .qr-box {
      flex: none;
      width: 132px;
      height: 132px;
      padding: 8px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .qr-box img {
      width: 100%;
      height: 100%;
      image-rendering: pixelated;
    }

    .qr-ph {
      color: #cdd0d3;
    }

    .access-right {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field-label {
      font-size: 12px;
      color: var(--muted);
    }

    .field-label.strong {
      font-weight: 700;
    }

    .url-btn {
      width: 100%;
      height: 40px;
      padding: 0 12px;
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--elev);
      border: 1px solid var(--border);
      border-radius: 9px;
      cursor: pointer;
      text-align: left;
    }

    .url-btn:hover {
      border-color: var(--accent);
    }

    .url-text {
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-size: 13px;
      color: var(--fg);
    }

    .url-icon {
      flex: none;
      color: var(--muted);
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
    }

    /* 設定 */
    .settings {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .col {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .col.ip {
      flex: 1;
      min-width: 0;
    }

    .col.port {
      flex: none;
      width: 118px;
    }

    .select-wrap {
      position: relative;
    }

    select, input[type="text"], input[type="password"], input.port {
      width: 100%;
      height: 42px;
      font-size: 14px;
      color: var(--fg);
      background: var(--elev);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    select {
      padding: 0 34px 0 12px;
      appearance: none;
      cursor: pointer;
    }

    input.port {
      padding: 0 12px;
    }

    select:focus, input:focus {
      border-color: var(--accent);
    }

    .select-caret {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      pointer-events: none;
    }

    .pw-wrap {
      position: relative;
      display: flex;
      align-items: center;
    }

    .pw-input {
      width: 100%;
      height: 42px;
      padding: 0 46px 0 12px;
      font-size: 14px;
      color: var(--fg);
      background: var(--elev);
      border: 1px solid var(--border);
      border-radius: 9px;
      outline: none;
    }

    .pw-toggle {
      position: absolute;
      right: 6px;
      width: 34px;
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 7px;
      cursor: pointer;
    }

    .pw-toggle:hover {
      background: var(--hover);
    }

    .save-row {
      display: flex;
      justify-content: flex-end;
    }

    .save-btn {
      height: 40px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      gap: 7px;
      border: none;
      background: var(--accent);
      color: #fff;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
    }

    .save-btn:hover {
      opacity: .9;
    }

    /* ログ */
    .log-area {
      flex: 1;
      min-height: 150px;
      display: flex;
      flex-direction: column;
      padding: 0 22px 22px;
    }

    .log-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .clear-btn {
      height: 28px;
      padding: 0 10px;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border);
      background: var(--elev);
      color: var(--muted);
      border-radius: 7px;
      font-size: 12px;
      cursor: pointer;
    }

    .clear-btn:hover {
      background: var(--hover);
    }

    /* バージョン表記（ウィンドウ最下部。ログ領域のスクロールに巻き込まれないよう .body の外に置く） */
    .version-bar {
      padding: 7px 22px;
      border-top: 1px solid var(--border);
      text-align: center;
      font-size: 11px;
      color: var(--muted);
    }

    .log {
      flex: 1;
      max-height: 300px;
      margin: 0;
      overflow-y: auto;
      padding: 12px 14px;
      background: #1c2023;
      color: #d6dbde;
      border: 1px solid var(--border);
      border-radius: 9px;
      font-size: 12px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-all;
    }
  </style>
</head>
<body>
  <div class="body">
    <div class="top">

      <!-- サーバー ON/OFF トグル -->
      <div class="toggle-wrap">
        <button id="sw-toggle" class="switch" role="switch" aria-label="サーバーの起動/停止">
          <span class="switch-knob"></span>
        </button>
        <div id="sw-status" class="status">
          <span id="sw-status-dot" class="status-dot"></span>
          <span id="sw-status-text">サーバー停止中</span>
        </div>
        <p class="toggle-note">
          ウィンドウを閉じてもサーバーは終了しません。<br>
          サーバーを終了するには上のスイッチで停止させてください。
        </p>
      </div>

      <div class="divider"></div>

      <!-- アクセス情報 -->
      <div class="access">
        <div class="qr-box">
          <img id="sw-qr" alt="QR" hidden>
          <span id="sw-qr-ph" class="qr-ph"></span>
        </div>
        <div class="access-right">
          <label class="field-label strong">アクセス用 URL</label>
          <button id="sw-copy" class="url-btn">
            <span id="sw-url" class="url-text mono">-</span>
            <span id="sw-copy-icon" class="url-icon"></span>
          </button>
          <span id="sw-copy-hint" class="hint">クリックするとクリップボードにコピーされます</span>
        </div>
      </div>

      <div class="divider"></div>

      <!-- 設定 -->
      <div class="settings">
        <div class="section-title">設定</div>
        <div class="row">
          <div class="col ip">
            <label class="field-label">IP アドレス</label>
            <div class="select-wrap">
              <select id="sw-ip" class="mono"></select>
              <span id="sw-ip-caret" class="select-caret"></span>
            </div>
          </div>
          <div class="col port">
            <label class="field-label">ポート</label>
            <input id="sw-port" class="port mono" inputmode="numeric" maxlength="5" placeholder="8000">
          </div>
        </div>
        <div class="col">
          <label class="field-label">ログインパスワード</label>
          <div class="pw-wrap">
            <input id="sw-pw" class="pw-input" type="password" maxlength="128" placeholder="パスワードを設定">
            <button id="sw-pw-toggle" class="pw-toggle" tabindex="-1" aria-label="パスワードの表示切替">
              <span id="sw-pw-icon"></span>
            </button>
          </div>
          <span class="hint">空欄にするとパスワード認証をしません。英数記号のみ最大128文字。</span>
        </div>
        <div class="save-row">
          <button id="sw-save" class="save-btn">
            <span id="sw-save-icon"></span>
            <span id="sw-save-label">保存</span>
          </button>
        </div>
      </div>

      <div class="divider"></div>
    </div>

    <!-- ログ -->
    <div class="log-area">
      <div class="log-head">
        <div class="section-title">ログ</div>
        <button id="sw-clear" class="clear-btn">
          <span id="sw-clear-icon"></span>クリア
        </button>
      </div>
      <pre id="sw-log" class="log mono"></pre>
    </div>
  </div>

  <!-- バージョン表記。値は manifest.json から status-window.js が埋める -->
  <div class="version-bar">
    <span id="sw-version" class="mono"></span>
  </div>

  <!-- モジュールは ME 名前空間で連携する。読み込み順に依存があるため注意 -->
  <script src="js/logger.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/server.js"></script>
  <script src="js/static.js"></script>
  <!-- version.js は static.js の pluginRoot() を使うため static.js より後 -->
  <script src="js/version.js"></script>
  <script src="js/eagle-adapter.js"></script>
  <script src="js/image.js"></script>
  <script src="js/api-eagle.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/status-window.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
