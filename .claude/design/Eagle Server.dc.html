<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,0&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#232729;--fg:#ffffff;--panel:#2a2f31;--elev:#33383b;--border:rgba(255,255,255,.13);--muted:#9aa1a5;--hover:rgba(255,255,255,.07);--accent:#2f6fed;--ok:#22a06b;--err:#e2554b;--warn:#e0a422}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#15181a}
body{font-family:"Noto Sans JP","Helvetica Neue",Helvetica,Arial,"Hiragino Sans",sans-serif;-webkit-font-smoothing:antialiased;color:var(--fg)}
.ms{font-family:'Material Symbols Outlined';font-weight:400;font-style:normal;line-height:1;display:inline-block;-webkit-font-smoothing:antialiased;user-select:none}
input,select,button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.2);border-radius:5px}
</style>
</helmet>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#15181a">
  <div style="width:520px;height:660px;display:flex;flex-direction:column;background:var(--bg);border-radius:11px;overflow:hidden;box-shadow:0 24px 70px rgba(0,0,0,.32),0 3px 10px rgba(0,0,0,.18)">

    <!-- title bar -->
    <div style="flex:none;display:flex;align-items:center;height:40px;padding:0 14px;background:var(--elev);border-bottom:1px solid var(--border);user-select:none">
      <div style="display:flex;gap:8px;align-items:center">
        <span style="width:12px;height:12px;border-radius:50%;background:#ff5f57"></span>
        <span style="width:12px;height:12px;border-radius:50%;background:#febc2e"></span>
        <span style="width:12px;height:12px;border-radius:50%;background:#28c840"></span>
      </div>
      <div style="flex:1;text-align:center;font-size:13px;font-weight:700;color:var(--fg);letter-spacing:.2px">Mobile Eagle — サーバー</div>
      <div style="width:52px"></div>
    </div>

    <!-- body -->
    <div style="flex:1;overflow-y:auto;display:flex;flex-direction:column">
      <div style="flex:none;display:flex;flex-direction:column;gap:20px;padding:22px">

        <!-- server toggle -->
        <div style="display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center">
          <button onClick="{{ onToggleServer }}" role="switch" style="{{ trackStyle }}">
            <span style="{{ knobStyle }}"></span>
          </button>
          <div style="{{ statusStyle }}">
            <span style="width:9px;height:9px;border-radius:50%;background:{{ statusDot }};display:inline-block;flex:none"></span>
            <span>{{ statusText }}</span>
          </div>
        </div>

        <div style="height:1px;background:var(--border)"></div>

        <!-- access info -->
        <div style="display:flex;gap:18px;align-items:center">
          <div style="flex:none;width:132px;height:132px;padding:8px;background:#fff;border:1px solid var(--border);border-radius:10px;display:flex;align-items:center;justify-content:center">
            <sc-if value="{{ running }}" hint-placeholder-val="{{ true }}">
              <img src="{{ qrSrc }}" alt="QR" style="width:100%;height:100%;image-rendering:pixelated;display:block">
            </sc-if>
            <sc-if value="{{ stopped }}" hint-placeholder-val="{{ false }}">
              <span class="ms" style="font-size:52px;color:var(--border)">qr_code_2</span>
            </sc-if>
          </div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">
            <label style="font-size:12px;font-weight:700;color:var(--muted)">アクセス用 URL</label>
            <button onClick="{{ onCopyUrl }}" style="width:100%;height:40px;padding:0 12px;display:flex;align-items:center;gap:8px;background:var(--elev);border:1px solid var(--border);border-radius:9px;cursor:pointer;text-align:left" style-hover="border-color:var(--accent)">
              <span style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--fg)">{{ url }}</span>
              <span class="ms" style="font-size:18px;color:{{ copyIconColor }};flex:none">{{ copyIcon }}</span>
            </button>
            <span style="font-size:11px;color:var(--muted)">{{ copyHint }}</span>
          </div>
        </div>

        <div style="height:1px;background:var(--border)"></div>

        <!-- settings -->
        <div style="display:flex;flex-direction:column;gap:14px">
          <div style="font-size:12px;font-weight:700;color:var(--muted)">設定</div>
          <div style="display:flex;gap:12px">
            <div style="flex:1;display:flex;flex-direction:column;gap:6px;min-width:0">
              <label style="font-size:12px;color:var(--muted)">IP アドレス</label>
              <div style="position:relative">
                <select value="{{ ip }}" onChange="{{ onIp }}" style="width:100%;height:42px;padding:0 34px 0 12px;font-size:14px;color:var(--fg);background:var(--elev);border:1px solid var(--border);border-radius:9px;outline:none;appearance:none;font-family:'JetBrains Mono',monospace;cursor:pointer">
                  <sc-for list="{{ ipOptions }}" as="opt" hint-placeholder-count="3"><option value="{{ opt.value }}">{{ opt.label }}</option></sc-for>
                </select>
                <span class="ms" style="position:absolute;right:9px;top:50%;transform:translateY(-50%);font-size:20px;color:var(--muted);pointer-events:none">expand_more</span>
              </div>
            </div>
            <div style="flex:none;width:118px;display:flex;flex-direction:column;gap:6px">
              <label style="font-size:12px;color:var(--muted)">ポート</label>
              <input value="{{ port }}" onInput="{{ onPort }}" inputmode="numeric" maxlength="5" placeholder="8000" style="width:100%;height:42px;padding:0 12px;font-size:14px;color:var(--fg);background:var(--elev);border:1px solid var(--border);border-radius:9px;outline:none;font-family:'JetBrains Mono',monospace">
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:6px">
            <label style="font-size:12px;color:var(--muted)">ログインパスワード</label>
            <div style="position:relative;display:flex;align-items:center">
              <input value="{{ password }}" onInput="{{ onPassword }}" type="{{ pwType }}" maxlength="128" placeholder="パスワードを設定" style="width:100%;height:42px;padding:0 46px 0 12px;font-size:14px;color:var(--fg);background:var(--elev);border:1px solid var(--border);border-radius:9px;outline:none">
              <button onClick="{{ onTogglePw }}" tabindex="-1" style="position:absolute;right:6px;width:34px;height:34px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--muted);border-radius:7px;cursor:pointer" style-hover="background:var(--hover)"><span class="ms" style="font-size:20px">{{ pwIcon }}</span></button>
            </div>
            <span style="font-size:11px;color:var(--muted)">空欄にするとパスワード認証をしません。英数記号のみ最大128文字。</span>
          </div>
          <div style="display:flex;justify-content:flex-end">
            <button onClick="{{ onSave }}" style="height:40px;padding:0 22px;display:flex;align-items:center;gap:7px;border:none;background:var(--accent);color:#fff;border-radius:9px;font-size:14px;font-weight:700;cursor:pointer" style-hover="opacity:.9"><span class="ms" style="font-size:18px">{{ saveIcon }}</span>{{ saveLabel }}</button>
          </div>
        </div>

        <div style="height:1px;background:var(--border)"></div>
      </div>

      <!-- log -->
      <div style="flex:1;min-height:150px;display:flex;flex-direction:column;padding:0 22px 22px">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
          <div style="font-size:12px;font-weight:700;color:var(--muted)">ログ</div>
          <button onClick="{{ onClearLog }}" style="height:28px;padding:0 10px;display:flex;align-items:center;gap:5px;border:1px solid var(--border);background:var(--elev);color:var(--muted);border-radius:7px;font-size:12px;cursor:pointer" style-hover="background:var(--hover)"><span class="ms" style="font-size:15px">delete_sweep</span>クリア</button>
        </div>
        <pre ref="{{ logRef }}" style="flex:1;margin:0;overflow-y:auto;padding:12px 14px;background:#1c2023;color:#d6dbde;border:1px solid var(--border);border-radius:9px;font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;white-space:pre-wrap;word-break:break-all">{{ logText }}</pre>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:568,&quot;height&quot;:708}}">
class Component extends DCLogic {
  constructor(props){
    super(props);
    const now=new Date();
    this.state={
      running:false, status:'stopped',
      ip:'0.0.0.0', port:'8000', password:'', pwVisible:false,
      copied:false, saved:false,
      log:this.seedLog(),
    };
    this.logRef=React.createRef();
  }
  ts(offsetMs){ const d=new Date(Date.now()-offsetMs); const p=(n,l=2)=>String(n).padStart(l,'0'); return p(d.getHours())+':'+p(d.getMinutes())+':'+p(d.getSeconds())+'.'+p(d.getMilliseconds(),3); }
  seedLog(){ return [
    {t:this.ts(1200),m:'プラグインを開始しました'},
    {t:this.ts(900),m:'/api/eagle のエンドポイントを登録しました'},
    {t:this.ts(600),m:'利用可能なネットワークインターフェースを検出しました (3件)'},
  ]; }
  push(m){ this.setState(s=>({log:[...s.log,{t:this.ts(0),m}].slice(-200)}),()=>{ const el=this.logRef.current; if(el)el.scrollTop=el.scrollHeight; }); }
  toggleServer(){
    if(this.state.running){
      this.setState({running:false,status:'stopped'});
      this.push('サーバーを停止しました');
    } else {
      this.setState({running:true,status:'running'});
      this.push('サーバーを起動しました '+this.state.ip+':'+this.state.port);
      this.push('QR コードを生成しました');
    }
  }
  renderVals(){
    const s=this, st=this.state;
    const running=st.status==='running';
    const url='http://'+(st.ip==='0.0.0.0'?'192.168.1.42':st.ip)+':'+st.port+'/';
    const statusMap={
      running:{text:'サーバー起動中',dot:'var(--ok)',color:'var(--ok)'},
      stopped:{text:'サーバー停止中',dot:'var(--muted)',color:'var(--muted)'},
      failed:{text:'サーバーの起動に失敗。詳細はログをご覧ください。',dot:'var(--err)',color:'var(--err)'},
    };
    const sm=statusMap[st.status];
    return {
      running, stopped:!running,
      trackStyle:'position:relative;width:74px;height:38px;border:none;border-radius:19px;cursor:pointer;padding:0;transition:background .2s;background:'+(running?'var(--ok)':'#c4c7cb'),
      knobStyle:'position:absolute;top:3px;left:'+(running?'39px':'3px')+';width:32px;height:32px;border-radius:50%;background:#fff;box-shadow:0 2px 5px rgba(0,0,0,.3);transition:left .2s',
      onToggleServer:()=>s.toggleServer(),
      statusStyle:'display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;justify-content:center;color:'+sm.color,
      statusText:sm.text, statusDot:sm.dot,

      url, qrSrc:'https://api.qrserver.com/v1/create-qr-code/?size=180x180&margin=0&data='+encodeURIComponent(url),
      copyIcon:st.copied?'check':'content_copy', copyIconColor:st.copied?'var(--ok)':'var(--muted)',
      copyHint:st.copied?'コピーしました':'クリックするとクリップボードにコピーされます',
      onCopyUrl:()=>{ try{navigator.clipboard&&navigator.clipboard.writeText(url);}catch(e){} s.setState({copied:true}); clearTimeout(s._ct); s._ct=setTimeout(()=>s.setState({copied:false}),1600); },

      ipOptions:[
        {value:'0.0.0.0',label:'0.0.0.0'},
        {value:'192.168.1.42',label:'192.168.1.42'},
        {value:'192.168.1.88',label:'192.168.1.88'},
        {value:'127.0.0.1',label:'127.0.0.1'},
      ],
      ip:st.ip, onIp:(e)=>s.setState({ip:e.target.value}),
      port:st.port, onPort:(e)=>s.setState({port:e.target.value.replace(/\D/g,'').slice(0,5)}),
      password:st.password, onPassword:(e)=>s.setState({password:e.target.value.slice(0,128)}),
      pwType:st.pwVisible?'text':'password', pwIcon:st.pwVisible?'visibility_off':'visibility',
      onTogglePw:()=>s.setState(x=>({pwVisible:!x.pwVisible})),
      saveIcon:st.saved?'check':'save', saveLabel:st.saved?'保存しました':'保存',
      onSave:()=>{ s.push('設定を保存しました ('+st.ip+':'+st.port+(st.password?' / パスワード認証あり':' / パスワード認証なし')+')'); if(running){s.push('新しい設定でサーバーを再起動しました');} s.setState({saved:true}); clearTimeout(s._st); s._st=setTimeout(()=>s.setState({saved:false}),1600); },

      logRef:this.logRef,
      logText:st.log.map(l=>'['+l.t+'] '+l.m).join('\n'),
      onClearLog:()=>s.setState({log:[]}),
    };
  }
}
</script>
</body>
</html>
